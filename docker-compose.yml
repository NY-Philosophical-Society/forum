# Local Postgres for development, for people who would rather use Docker than
# the bundled binaries. This is an *alternative* to `npm run db:up` (see
# apps/api/scripts/local-postgres.ts), not a companion — both bind 5433 with
# the same credentials and database name, so apps/api/.env's DATABASE_URL is
# identical either way and only one can run at a time.
#
#   docker compose up -d db     start
#   docker compose down         stop, keep the data
#   docker compose down -v      stop and delete the data
#
# Then, from apps/api: npm run db:deploy && npm run db:seed
#
# This file is for local development only. Production Postgres is a managed
# service from the host — see docs/DEPLOY.md.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nyps
      POSTGRES_PASSWORD: nyps
      POSTGRES_DB: nyps_forum
    ports:
      # 5433 on the host, so a Postgres someone already runs on 5432 keeps working.
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nyps -d nyps_forum"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
